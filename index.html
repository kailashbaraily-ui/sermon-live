<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7f5f0"><title>Sermon Interpreter Assist</title><style>:root{--fs:30px}*{box-sizing:border-box}body{margin:0;background:#f7f5f0;color:#171715;font:16px/1.45 system-ui,-apple-system,"Noto Sans Devanagari",sans-serif}header{position:sticky;top:0;background:#f7f5f0ee;border-bottom:1px solid #d9d4ca;padding:10px 12px;z-index:2}.w,main{max-width:900px;margin:auto}.t{font-weight:800;font-size:18px;margin-bottom:8px}.c{display:flex;gap:7px;flex-wrap:wrap}button{font:inherit;padding:10px 13px;border:1px solid #cfc8bc;border-radius:12px;background:#fff}#start{background:#8a5a14;color:#fff;border-color:#8a5a14;font-weight:800;flex:1}#start.on{background:#b83227;border-color:#b83227}#status{font-size:13px;margin-top:7px}.good{color:#176b43}.bad{color:#b83227}main{padding:12px 12px 48px}.live{background:#fff;border:2px dashed #b7afa2;border-radius:15px;padding:12px 14px;min-height:92px}.live.on{border-color:#8a5a14}.lbl{font-size:12px;font-weight:800;color:#6d6b66;text-transform:uppercase;letter-spacing:.08em}.liveText{font-size:20px;margin-top:5px}.help{font-size:12px;color:#6d6b66;margin:8px 2px}.card{background:#fff;border:1px solid #d9d4ca;border-radius:15px;padding:14px;margin-top:12px}.card:first-child{border:2px solid #8a5a14}.en{font-size:15px;color:#5c5a55}.say{font-size:12px;font-weight:800;color:#0b4f8a;margin-top:8px}.ne{font-size:var(--fs);font-weight:650;line-height:1.48;color:#0b4f8a;margin-top:3px}.note{font-size:14px;background:#f3f7fa;padding:8px 10px;border-radius:10px;margin-top:8px}.meta{font-size:11px;color:#969087;margin-top:7px}.setup{display:none;background:#fff8e9;border:1px solid #ead7aa;border-radius:12px;padding:10px 12px;font-size:13px;margin-top:12px}.setup.show{display:block}@media(max-width:560px){.t{font-size:16px}.liveText{font-size:18px}}</style></head><body><header><div class="w"><div class="t">🎙 Sermon Interpreter Assist <small>AI</small></div><div class="c"><button id="start">Start live assist</button><button id="clear">Clear</button><button id="plus">A+</button><button id="minus">A−</button></div><div id="status">Ready. High-accuracy live transcription.</div></div></header><main><section id="liveBox" class="live"><div class="lbl">Live English</div><div id="live" class="liveText">Press Start and let the phone hear the English speaker.</div></section><div class="help">Designed for fast sermons: a thought is committed after a short pause, or about every 4–5 seconds during continuous speech.</div><div id="setup" class="setup"></div><section id="cards"></section></main><script>(()=>{'use strict';const $=id=>document.getElementById(id),start=$('start'),status=$('status'),live=$('live'),liveBox=$('liveBox'),cards=$('cards'),setup=$('setup');let pc,dc,stream,ctx,an,timer,running=false,speech=false,started=0,lastVoice=0,lastCommit=0,fs=30,history=[];const parts=new Map();function stat(t,k=''){status.textContent=t;status.className=k}function clean(t){return(t||'').replace(/\s+/g,' ').trim()}function setLive(t){live.textContent=clean(t)||(running?'Listening…':'Press Start and let the phone hear the English speaker.')}function ui(){start.textContent=running?'Stop live assist':'Start live assist';start.className=running?'on':'';liveBox.classList.toggle('on',running)}function card(id,en){let a=document.createElement('article');a.className='card';a.innerHTML='<div class="en"></div><div class="say">नेपालीमा भन्नुहोस्</div><div class="ne">अर्थ तयार हुँदैछ…</div><div class="note" hidden></div><div class="meta">Understanding sermon context…</div>';a.querySelector('.en').textContent=en;cards.prepend(a);return a}async function interpret(id,en){let a=card(id,en),ne=a.querySelector('.ne'),note=a.querySelector('.note'),meta=a.querySelector('.meta');try{let r=await fetch('/api/interpret',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({current:en,context:history.slice(-5).join('\n')})}),d=await r.json();if(!r.ok)throw Error(d.error||`HTTP ${r.status}`);ne.textContent=d.say||'—';if(d.note){note.hidden=false;note.textContent='सन्दर्भ: '+d.note}meta.textContent='AI interpretation • recent sermon context included';history.push(en);if(history.length>12)history.shift()}catch(e){ne.textContent='व्याख्या आउन सकेन।';ne.style.color='#b83227';meta.textContent='Interpretation error: '+e.message}}function commit(){if(!dc||dc.readyState!=='open'||performance.now()-lastCommit<900)return;dc.send(JSON.stringify({type:'input_audio_buffer.commit'}));lastCommit=performance.now();speech=false;started=0}function meter(s){ctx=new(window.AudioContext||window.webkitAudioContext)();let src=ctx.createMediaStreamSource(s);an=ctx.createAnalyser();an.fftSize=1024;src.connect(an);let b=new Float32Array(an.fftSize);timer=setInterval(()=>{if(!running)return;an.getFloatTimeDomainData(b);let sum=0;for(let v of b)sum+=v*v;let rms=Math.sqrt(sum/b.length),now=performance.now();if(rms>=.018||(speech&&rms>=.01)){if(!speech){speech=true;started=now}lastVoice=now}if(speech&&((now-lastVoice>=680)||(now-started>=4500)))commit()},90)}function event(e){if(e.type==='conversation.item.input_audio_transcription.delta'){let id=e.item_id||'live',t=(parts.get(id)||'')+(e.delta||'');parts.set(id,t);setLive(t)}else if(e.type==='conversation.item.input_audio_transcription.completed'){let id=e.item_id||('i'+Date.now()),en=clean(e.transcript||parts.get(id)||'');parts.delete(id);setLive('');if(en)interpret(id,en)}else if(e.type==='error')stat(e.error?.message||'Realtime transcription error','bad')}async function begin(){setup.classList.remove('show');if(!isSecureContext&&location.hostname!=='localhost')throw Error('Open from HTTPS or localhost so the microphone can work.');stat('Connecting to high-accuracy transcription…');let tr=await fetch('/api/realtime-token',{method:'POST'}),td=await tr.json();if(!tr.ok||!td.value){if(tr.status===503){setup.textContent='Server setup needed: add OPENAI_API_KEY to the deployed app.';setup.classList.add('show')}throw Error(td.error||'Could not create realtime session')}stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true,channelCount:1}});pc=new RTCPeerConnection();pc.addTrack(stream.getAudioTracks()[0],stream);dc=pc.createDataChannel('oai-events');dc.onopen=()=>stat('🎙 Mic is ON • AI transcription is listening.','good');dc.onmessage=x=>{try{event(JSON.parse(x.data))}catch{}};dc.onerror=()=>stat('Realtime connection problem.','bad');let offer=await pc.createOffer();await pc.setLocalDescription(offer);let sr=await fetch('https://api.openai.com/v1/realtime/calls',{method:'POST',body:offer.sdp,headers:{Authorization:`Bearer ${td.value}`,'Content-Type':'application/sdp'}});if(!sr.ok)throw Error('Realtime connection failed: '+await sr.text());await pc.setRemoteDescription({type:'answer',sdp:await sr.text()});meter(stream)}async function end(){if(speech)commit();running=false;ui();clearInterval(timer);try{await ctx?.close()}catch{}stream?.getTracks().forEach(t=>t.stop());dc?.close();pc?.close();pc=dc=stream=ctx=an=null;stat('Stopped.');setLive('')}start.onclick=async()=>{if(running)return end();running=true;ui();setLive('');try{await begin()}catch(e){running=false;ui();stat(e.message,'bad');stream?.getTracks().forEach(t=>t.stop())}};$('clear').onclick=()=>{cards.innerHTML='';history=[];setLive('')};$('plus').onclick=()=>{fs=Math.min(46,fs+2);document.documentElement.style.setProperty('--fs',fs+'px')};$('minus').onclick=()=>{fs=Math.max(20,fs-2);document.documentElement.style.setProperty('--fs',fs+'px')};addEventListener('beforeunload',()=>stream?.getTracks().forEach(t=>t.stop()))})();</script></body></html>
